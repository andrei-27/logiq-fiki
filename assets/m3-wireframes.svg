<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="800" viewBox="0 0 1180 800" role="img" aria-labelledby="title description">
  <title id="title">LogiQ M3: five wireframes and their interactions</title>
  <desc id="description">Reading leads to an explanation. The explanation offers three optional branches: context and evidence questions, sharing, and feedback. Every branch can return to the explanation or reading. All content is illustrative; no live analysis or feedback submission is implemented.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#52584d" stroke-width="1.5"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #242822; font-size: 15px; }
      .kicker { font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 1px; fill: #52584d; }
      .heading { font-family: Georgia, serif; font-size: 23px; }
      .small { font-size: 13px; fill: #52584d; }
      .frame { fill: #fffefa; stroke: #8d9583; }
      .bar { fill: #e7e9e1; }
      .button { fill: #e7e9e1; stroke: #8d9583; }
      .connector { fill: none; stroke: #52584d; stroke-width: 1.5; marker-end: url(#arrow); }
      .label { font-size: 12px; font-weight: bold; fill: #52584d; }
    </style>
  </defs>
  <rect width="1180" height="800" fill="#f5f3ed"/>
  <text x="30" y="33" class="kicker">LOGIQ / M3 / WIREFRAME OVERVIEW</text>
  <text x="30" y="65" class="heading">A second look, on the reader's terms.</text>
  <text x="30" y="90" class="small">Main path: 01 to 02. Context, sharing and feedback are independent, optional branches.</text>

  <g transform="translate(30 115)">
    <rect class="frame" width="320" height="245" rx="5"/>
    <path class="bar" d="M1 5 Q1 1 5 1 H315 Q319 1 319 5 V35 H1Z"/>
    <text x="16" y="24" class="kicker">01 / READING</text>
    <text x="16" y="64" class="heading">Choose a passage</text>
    <text x="16" y="91" class="small">Example article / not a live site</text>
    <text x="16" y="123">"Thousands shared this claim,</text>
    <rect x="14" y="131" width="184" height="24" fill="#e1e3dc"/>
    <text x="16" y="149">so it must be true."</text>
    <rect class="button" x="16" y="171" width="226" height="34" rx="3"/>
    <text x="29" y="193">Explain this passage</text>
    <text x="16" y="229" class="small">Sample selector: 3 fixed arguments</text>
  </g>
  <path class="connector" d="M350 245 H425"/>
  <text x="358" y="229" class="label">Explain</text>

  <g transform="translate(435 115)">
    <rect class="frame" width="320" height="245" rx="5"/>
    <path class="bar" d="M1 5 Q1 1 5 1 H315 Q319 1 319 5 V35 H1Z"/>
    <text x="16" y="24" class="kicker">02 / EXPLANATION</text>
    <text x="267" y="24" class="small">Close</text>
    <text x="16" y="64" class="heading">Understand the leap</text>
    <text x="16" y="96">Potential appeal to popularity</text>
    <text x="16" y="125" class="small">Shares show reach, not evidence.</text>
    <text x="16" y="147" class="small">The claim could still be true.</text>
    <rect class="button" x="16" y="169" width="288" height="32" rx="3"/>
    <text x="28" y="190">Context / Share / Feedback</text>
    <text x="16" y="229" class="small">Dismiss returns to reading (01).</text>
  </g>

  <g transform="translate(840 128)">
    <text x="0" y="22" class="kicker">WIREFRAME CONVENTIONS</text>
    <text x="0" y="57">Filled box = action or control</text>
    <text x="0" y="84">Arrow = screen transition</text>
    <text x="0" y="111">Numbers = screen identifiers</text>
    <text x="0" y="152" class="small">This is a structural design, not</text>
    <text x="0" y="173" class="small">a screenshot of a working extension.</text>
    <text x="0" y="207" class="small">No mandatory five-step wizard.</text>
  </g>

  <path class="connector" d="M595 360 V400 H190 V447"/>
  <path class="connector" d="M595 360 V447"/>
  <path class="connector" d="M595 360 V400 H1000 V447"/>
  <rect x="402" y="381" width="384" height="29" fill="#f5f3ed"/>
  <text x="421" y="401" class="label">OPTIONAL BRANCHES FROM THE EXPLANATION</text>
  <text x="200" y="433" class="label">See context</text>
  <text x="606" y="433" class="label">Prepare share</text>
  <text x="1010" y="433" class="label">Give feedback</text>

  <g transform="translate(30 455)">
    <rect class="frame" width="320" height="255" rx="5"/>
    <path class="bar" d="M1 5 Q1 1 5 1 H315 Q319 1 319 5 V35 H1Z"/>
    <text x="16" y="24" class="kicker">03 / CONTEXT</text>
    <text x="16" y="64" class="heading">Look beyond the label</text>
    <text x="16" y="98">Why this reasoning may fail</text>
    <text x="16" y="125">When the distinction matters</text>
    <rect class="button" x="16" y="143" width="288" height="32" rx="3"/>
    <text x="28" y="164">Expand plain-language definition</text>
    <text x="16" y="201" class="small">What evidence supports the claim?</text>
    <text x="16" y="224" class="small">Questions, not retrieved sources.</text>
    <text x="16" y="244" class="small">Back to 02 / Return to reading 01</text>
  </g>
  <g transform="translate(435 455)">
    <rect class="frame" width="320" height="255" rx="5"/>
    <path class="bar" d="M1 5 Q1 1 5 1 H315 Q319 1 319 5 V35 H1Z"/>
    <text x="16" y="24" class="kicker">04 / SHARE</text>
    <text x="16" y="64" class="heading">Share the reasoning</text>
    <rect x="16" y="83" width="288" height="81" fill="#f5f3ed" stroke="#b6beaa"/>
    <text x="27" y="107" class="small">Passage + explanation + question</text>
    <text x="27" y="130" class="small">Illustrative / not fact-checked</text>
    <text x="27" y="152" class="small">Keep the caveats attached.</text>
    <rect class="button" x="16" y="178" width="185" height="32" rx="3"/>
    <text x="28" y="199">Copy explanation</text>
    <text x="16" y="229" class="small">Copied / manual-copy fallback</text>
    <text x="16" y="246" class="small">Back to 02 / Return to reading 01</text>
  </g>
  <g transform="translate(840 455)">
    <rect class="frame" width="310" height="255" rx="5"/>
    <path class="bar" d="M1 5 Q1 1 5 1 H305 Q309 1 309 5 V35 H1Z"/>
    <text x="16" y="24" class="kicker">05 / FEEDBACK</text>
    <text x="16" y="64" class="heading">Challenge the explanation</text>
    <text x="16" y="97">Helpful / Unclear / I disagree</text>
    <rect x="16" y="112" width="278" height="47" fill="#f5f3ed" stroke="#b6beaa"/>
    <text x="27" y="140" class="small">Optional: what would you change?</text>
    <rect class="button" x="16" y="176" width="236" height="32" rx="3"/>
    <text x="28" y="197">Preview confirmation</text>
    <text x="16" y="228" class="small">Demo only: not sent or saved.</text>
    <text x="16" y="246" class="small">Back to 02 / Reset to reading 01</text>
  </g>
  <text x="30" y="748" class="small">Every optional screen can return to the explanation or reading. Closing an explanation never requires feedback.</text>
  <text x="30" y="775" class="kicker">INTERACTIVE VERSION: WIREFRAMES.HTML / LANDING PAGE: LANDING.HTML / HANDCRAFTED EXAMPLES ONLY</text>
</svg>
